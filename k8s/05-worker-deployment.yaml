apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: workflow-engine
spec:
  replicas: 5
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
      - name: worker
        image: workflow-worker:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: workflow-config
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: workflow-secrets
              key: database-url
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "300m"
---
