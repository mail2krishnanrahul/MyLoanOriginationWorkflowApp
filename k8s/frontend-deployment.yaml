apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-frontend
  labels:
    app: workflow-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workflow-frontend
  template:
    metadata:
      labels:
        app: workflow-frontend
    spec:
      containers:
      - name: workflow-frontend
        image: workflow-frontend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: workflow-frontend
spec:
  selector:
    app: workflow-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
