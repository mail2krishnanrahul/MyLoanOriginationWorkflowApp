apiVersion: batch/v1
kind: Job
metadata:
  name: workflow-engine-migration
  namespace: workflow-engine
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: workflow-engine-migration
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: migrate/migrate:v4.16.2
          command: ["/migrate"]
          args:
            - "-path=/migrations"
            - "-database=$(DB_URL)"
            - "up"
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: workflow-db-secret
                  key: connection-string
          volumeMounts:
            - name: migrations-volume
              mountPath: /migrations
              readOnly: true
      volumes:
        - name: migrations-volume
          configMap:
            name: workflow-engine-migrations-cm
            # Note: in a real deployment, migrations are usually baked into a custom migration image
            # or populated via an InitContainer pulling from Git.
